name: test-baseline

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  node-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test "tests/unit/**/*.test.mjs" "tests/integration/**/*.test.mjs" "tests/e2e/**/*.test.mjs"

